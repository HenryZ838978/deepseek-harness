[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness"
version = "0.2.0"
description = "Protocol-aware client for DeepSeek V4-Pro / V4-Flash. Survives the 16 documented quirks; ships the cache discount."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Henry Zhang" }]
keywords = ["deepseek", "llm", "openai", "agent", "harness", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
dotenv = [
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/HenryZ838978/deepseek-harness"
Reports = "https://github.com/HenryZ838978/deepseek-harness/tree/main/reports"
Spec = "https://github.com/HenryZ838978/deepseek-harness/tree/main/spec"

[tool.setuptools.packages.find]
include = ["deepseek_harness*"]
